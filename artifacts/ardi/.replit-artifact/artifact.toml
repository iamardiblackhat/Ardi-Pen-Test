kind = "web"
previewPath = "/"
title = "Ardi"
version = "1.0.0"
id = "artifacts/ardi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20061

[services.development]
run = "pnpm --filter @workspace/ardi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ardi", "run", "build" ]
serve = "static"
publicDir = "artifacts/ardi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20061"
BASE_PATH = "/"
